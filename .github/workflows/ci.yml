name: C# CI Formatting

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-format:
    name: Build, Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # フォーマット違反がある場合はエラー
      - name: Check Formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic PlusPim.slnx
