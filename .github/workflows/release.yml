name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # WARN: Dependabot の対象外．ほかのファイルと同じdigestにすること(CI検査あり)
  ALPINE_IMAGE: alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
  GLIBC_IMAGE: docker.io/library/almalinux:8@sha256:768bedc30fe0a536adb0a65d2eddb7caad364e514fbddd0ae9e026975f590342

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json

      # タグと csproj の不整合を弾く
      - name: Check version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          project="$(dotnet msbuild src/PlusPim/PlusPim.csproj -getProperty:Version)"
          if [ "$version" != "$project" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match <Version>$project</Version>"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        # AOTのRIDはターゲットと同じOSでしかビルドできない
        include:
          - { target: win-x64, rid: win-x64, runner: windows-latest }
          - { target: win-arm64, rid: win-arm64, runner: ubuntu-latest }
          - { target: linux-glibc-x64, rid: linux-x64, runner: ubuntu-latest }
          - { target: linux-glibc-arm64, rid: linux-arm64, runner: ubuntu-latest }
          - { target: linux-musl-x64, rid: linux-musl-x64, runner: ubuntu-latest }
          - { target: linux-musl-arm64, rid: linux-musl-arm64, runner: ubuntu-latest }
          - { target: osx-x64, rid: osx-x64, runner: ubuntu-latest }
          - { target: osx-arm64, rid: osx-arm64, runner: ubuntu-latest }

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json

      - name: Publish
        shell: bash
        run: sh scripts/build/publish.sh "${{ matrix.rid }}" "publish/${{ matrix.target }}"

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bin-${{ matrix.target }}
          path: publish/${{ matrix.target }}/
          if-no-files-found: error

  package:
    name: Package
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: bin-*
          path: bin

      - name: Archive
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          mkdir dist
          for dir in bin/bin-*; do
            target="${dir#bin/bin-}"
            cp LICENSE README.md "$dir/"
            case "$target" in
              win-*)
                name="pluspim-$VERSION-$target.zip"
                (cd "$dir" && zip -X -q "$GITHUB_WORKSPACE/dist/$name" pluspim.exe LICENSE README.md)
                ;;
              *)
                name="pluspim-$VERSION-$target.tar.gz"
                # アーティファクトは実行権限を保たない
                chmod 755 "$dir/pluspim"
                tar -czf "dist/$name" --owner=0 --group=0 -C "$dir" pluspim LICENSE README.md
                ;;
            esac
          done
          cp scripts/install/install.sh scripts/install/install.ps1 dist/
          (cd dist && sha256sum --text -- * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  verify:
    name: Verify ${{ matrix.target }}${{ matrix.image && format(' ({0})', matrix.image) || '' }}
    needs: [version, package]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win-x64, runner: windows-latest }
          - { target: win-arm64, runner: windows-11-arm }
          - { target: linux-glibc-x64, runner: ubuntu-latest }
          # 公称するglibcの下限で動くことを確かめる
          - { target: linux-glibc-x64, runner: ubuntu-latest, image: glibc }
          - { target: linux-glibc-arm64, runner: ubuntu-24.04-arm }
          - { target: linux-musl-x64, runner: ubuntu-latest, image: alpine }
          - { target: linux-musl-arm64, runner: ubuntu-24.04-arm, image: alpine }
          - { target: osx-x64, runner: macos-15-intel }
          - { target: osx-arm64, runner: macos-latest }

    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist

      - name: Check --version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          IMAGE: ${{ matrix.image || '' }}
        run: |
          set -eu
          cd dist
          case "$TARGET" in
            win-*) name="pluspim-$VERSION-$TARGET.zip"; exe=./x/pluspim.exe ;;
            *) name="pluspim-$VERSION-$TARGET.tar.gz"; exe=./x/pluspim ;;
          esac
          line="$(grep "  $name\$" SHA256SUMS)"
          if command -v sha256sum > /dev/null; then echo "$line" | sha256sum -c -; else echo "$line" | shasum -a 256 -c -; fi
          mkdir x
          case "$name" in
            *.zip) unzip -q "$name" -d x ;;
            *) tar -xzf "$name" -C x ;;
          esac
          case "$IMAGE" in
            # singlefilehost が動的リンクする依存を入れ，利用者と同じ前提で確かめる
            alpine)
              actual="$(docker run --rm -v "$PWD/x:/x:ro" "$ALPINE_IMAGE" \
                sh -c 'apk add --no-cache -q libstdc++ libgcc && /x/pluspim --version')"
              ;;
            glibc) actual="$(docker run --rm -v "$PWD/x:/x:ro" "$GLIBC_IMAGE" /x/pluspim --version)" ;;
            *) actual="$("$exe" --version | tr -d '\r')" ;;
          esac
          echo "$actual"
          case "$actual" in
            "PlusPim $VERSION" | "PlusPim $VERSION+"*) ;;
            *) echo "::error::unexpected version line: $actual"; exit 1 ;;
          esac

  release:
    name: Draft release
    needs: [version, verify]
    runs-on: ubuntu-latest
    # 要レビュワー環境で実施する
    # 書き込み権限のトークンはここのみとする
    environment: release
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist

      # ビルド後のタグの付け替えや，main にないコミットからのリリースを防ぐ
      - name: Check tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" -q .sha)"
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF_NAME now points to $tagged, but $GITHUB_SHA was built"
            exit 1
          fi
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" -q .status)"
          case "$status" in
            identical | behind) ;;
            *) echo "::error::$GITHUB_SHA is not on main ($status)"; exit 1 ;;
          esac

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --generate-notes $prerelease \
            --title "$GITHUB_REF_NAME"
