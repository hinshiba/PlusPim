name: VS Code Extension CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "clients/vscode/**"
      - ".github/workflows/vscode-ci.yml"

permissions:
  contents: read

jobs:
  lint-typecheck:
    name: Biome, Typecheck
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: clients/vscode

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome
        run: bun run ci

      - name: Typecheck
        run: bun run typecheck
