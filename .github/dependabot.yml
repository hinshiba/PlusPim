version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tests/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      nuget:
        update-types: [minor, patch]

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: bun
    directory: /clients/vscode
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      bun:
        update-types: [minor, patch]
    ignore:
      # 拡張はVS Code同梱のNodeで動くため合わせる
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
